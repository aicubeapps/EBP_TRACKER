<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Bear candle (red) -->
  <rect x="6" y="8" width="6" height="14" fill="#ff4466" rx="1"/>
  <line x1="9" y1="4" x2="9" y2="8" stroke="#ff4466" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9" y1="22" x2="9" y2="27" stroke="#ff4466" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bull candle (green) -->
  <rect x="20" y="10" width="6" height="12" fill="#00c896" rx="1"/>
  <line x1="23" y1="5" x2="23" y2="10" stroke="#00c896" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="22" x2="23" y2="28" stroke="#00c896" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small middle candle -->
  <rect x="13" y="12" width="6" height="8" fill="#8888a8" rx="1"/>
  <line x1="16" y1="7" x2="16" y2="12" stroke="#8888a8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="16" y2="25" stroke="#8888a8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
