name = "ebp-tracker-worker"
main = "src/ebp-worker.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "ebp-tracker-db"
database_id = "b93b206a-5537-4d12-8c86-a4b2372aae7f"

# EBP cron still via cron-job.org HTTP triggers (POST /cron/ebp)
# Market breadth runs hourly at :05 via CF native cron
[triggers]
crons = ["5 * * * *"]